<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081E15"/>
      <stop offset="50%" stop-color="#0F3826"/>
      <stop offset="100%" stop-color="#18563B"/>
    </linearGradient>
    <linearGradient id="proteinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="carbsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="fatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Outer subtle macro ring track -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="26"/>

  <!-- Macro Ring Segment 1: Protein (Green) -->
  <path d="M 256,80 A 176,176 0 0,1 423,200" fill="none" stroke="url(#proteinGrad)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Macro Ring Segment 2: Carbs (Amber) -->
  <path d="M 430,240 A 176,176 0 0,1 330,418" fill="none" stroke="url(#carbsGrad)" stroke-width="26" stroke-linecap="round"/>

  <!-- Macro Ring Segment 3: Fat (Sky Blue) -->
  <path d="M 285,429 A 176,176 0 0,1 110,340" fill="none" stroke="url(#fatGrad)" stroke-width="26" stroke-linecap="round"/>

  <!-- Central Emblem Container -->
  <circle cx="256" cy="256" r="116" fill="#0C2B1E" stroke="#22C55E" stroke-opacity="0.25" stroke-width="4" filter="url(#softShadow)"/>

  <!-- Stylized Nutrition Leaf & Sprout Emblem -->
  <!-- Main white silhouette -->
  <path d="M 256,168 C 256,168 196,220 196,276 C 196,309 223,336 256,336 C 289,336 316,309 316,276 C 316,220 256,168 256,168 Z" fill="#FFFFFF"/>
  <!-- Leaf inner cutout -->
  <path d="M 256,192 C 256,192 216,236 216,276 C 216,298 234,316 256,316 C 278,316 296,298 296,276 C 296,236 256,192 256,192 Z" fill="#0C2B1E"/>
  <!-- Inner vibrant green sprout center -->
  <path d="M 256,220 C 242,220 232,232 232,250 C 232,268 256,296 256,296 C 256,296 280,268 280,250 C 280,232 270,220 256,220 Z" fill="url(#leafGrad)"/>
  <!-- Subtle fork tine detail inside sprout -->
  <line x1="256" y1="230" x2="256" y2="280" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
</svg>
